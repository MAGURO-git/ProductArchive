site_name: M.G.R Tech Creations ドキュメント
site_description: BOOTHショップ「M.G.R Tech Creations」販売物のマニュアル
site_url: https://maguro-git.github.io/ProductArchive/
repo_url: https://github.com/MAGURO-git/ProductArchive
edit_uri: ""

theme:
  name: material
  language: ja
  # ショップのブランドロゴ。ヘッダーは常に暗色なのでマーク単体の白版を置く。
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: false

extra_css:
  - assets/extra.css

plugins:
  - search:
      lang: ja
  # 各ページ下部の「最終更新」。Git のコミット日時から出すので手で書かない。
  # CI 側は actions/checkout に fetch-depth: 0 が必要（浅いクローンだと全ページ同じ日付になる）。
  - git-revision-date-localized:
      type: date
      locale: ja
      enable_creation_date: false
      fallback_to_build_date: true

# 新製品を追加するときのひな形。サイトには出力しない。
exclude_docs: |
  _template/

# 製品を追加するときは、ここに 1 ブロック足す（docs/<製品スラッグ>/ を作る）。
nav:
  - ホーム: index.md
  - 利用規約: terms.md
  - GRAY OASIS:
      - gray-oasis/index.md
      - 導入: gray-oasis/install.md
      - ギミック一覧: gray-oasis/gimmicks.md
      - 使用アセット: gray-oasis/credits.md
      - 更新履歴: gray-oasis/changelog.md
  - Japan Classroom:
      - japan-classroom/index.md
      - 導入: japan-classroom/install.md
      - ギミック一覧: japan-classroom/gimmicks.md
      - 使用アセット: japan-classroom/credits.md
      - 更新履歴: japan-classroom/changelog.md
  - SF-ROOM for VRC:
      - sf-room/index.md
      - 導入: sf-room/install.md
      - ギミック一覧: sf-room/gimmicks.md
      - 使用アセット: sf-room/credits.md
      - 更新履歴: sf-room/changelog.md
  - Apartment for VRC:
      - apartment/index.md
      - 更新履歴: apartment/changelog.md
  - ハンドグレネードギミック:
      - hand-grenade/index.md
      - 更新履歴: hand-grenade/changelog.md
  - 無人航空機 / UAV:
      - uav/index.md
      - 更新履歴: uav/changelog.md
  # マニュアル未整備の製品は、更新履歴だけ先に置いてある。
  - 更新履歴:
      - Light Set: light-set/changelog.md
